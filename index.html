

<!DOCTYPE html>

<style>
/* ============================================================
   问舟 v0.4 · 全局设计 Token（Linear + visionOS 玻璃质感）
   修改品牌色、玻璃质感、圆角等只需改这里
   ============================================================ */
:root {
  /* 基础色 */
  --bg: #080A0A;                          /* 背景（严禁纯黑 #000） */
  --glass-border: rgba(255,235,215,0.14); /* 玻璃卡片边框 */
  --blur: blur(40px) saturate(180%);      /* 玻璃模糊参数 */

  /* 文字层级（字重上限 600） */
  --text-primary: rgba(255,255,255,0.95);
  --text-body: rgba(255,255,255,0.75);
  --text-aux: rgba(255,255,255,0.45);

  /* 品牌双色（所有阴影必须带色相，禁纯黑） */
  --accent: #4D6BFF;
  --accent-soft: rgba(77,107,255,0.28);
  --warm: #FFB980;
  --warm-soft: rgba(255,185,128,0.25);

  /* 圆角体系 */
  --radius-lg: 20px;
  --radius-sm: 16px;
  --radius-pill: 100px;

  /* 动效曲线 */
  --ease-spring: cubic-bezier(0.2, 0.75, 0.25, 1.1);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html { color-scheme: dark; }

body {
  /* v0.6：背景带自然层次（顶部微蓝紫 → 主色 → 底部微暖深），不再纯色 */
  background: linear-gradient(180deg, #0d0d18 0%, var(--bg) 52%, #0a0c10 100%);
  color: var(--text-body);
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'SF Pro Display',
               'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
  font-size: 15px;
  line-height: 1.6;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

/* v0.6：微噪点纹理（全屏极淡，增强质感；feTurbulence 0.9 细腻不刺眼） */
.noise-overlay {
  position: fixed; inset: 0;
  opacity: 0.032;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  pointer-events: none;
  z-index: 400;
}

::selection { background: rgba(77,107,255,0.35); color: #fff; }

/* 细滚动条 */
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 100px; }
::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }
::-webkit-scrollbar-track { background: transparent; }

/* ============================================================
   Lucide 图标基础样式（全局兜底，组件级覆盖尺寸）
   ============================================================ */
i[data-lucide] { display: inline-flex; }
svg.lucide { width: 1em; height: 1em; }

/* ============================================================
   环境光晕：左上冷光 + 右下暖光（必须同时存在，缓慢漂浮）
   ============================================================ */
.ambient { position: fixed; pointer-events: none; z-index: 0; filter: blur(70px); }
.ambient-cool {
  top: -18%; left: -14%;
  width: 58vw; height: 58vw;
  background: radial-gradient(circle, rgba(77,107,255,0.32), transparent 65%);
  animation: driftCool 22s ease-in-out infinite alternate;
}
.ambient-warm {
  bottom: -22%; right: -16%;
  width: 52vw; height: 52vw;
  background: radial-gradient(circle, rgba(255,185,128,0.2), transparent 65%);
  animation: driftWarm 26s ease-in-out infinite alternate;
}
@keyframes driftCool { to { transform: translate(5vw, 4vh) scale(1.08); } }
@keyframes driftWarm { to { transform: translate(-5vw, -4vh) scale(1.06); } }

/* ============================================================
   玻璃卡片（渐变通透 + 顶部高光 + 内发光）
   ============================================================ */
.glass {
  position: relative;
  background: linear-gradient(165deg, rgba(255,255,255,0.09), rgba(255,255,255,0.03) 55%, rgba(255,255,255,0.06));
  backdrop-filter: var(--blur);
  -webkit-backdrop-filter: var(--blur);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius-lg);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.1),
              inset 0 -1px 0 rgba(255,255,255,0.02),
              0 12px 40px rgba(10, 20, 40, 0.35);
}
/* v0.6：卡片顶部渐变光条（visionOS 特征；悬停时更亮） */
.glass::before {
  content: '';
  position: absolute; top: 0; left: 12%; right: 12%;
  height: 1px;
  border-radius: inherit;
  pointer-events: none;
  background: linear-gradient(90deg, transparent, rgba(99, 102, 241, 0.4), transparent);
  opacity: 0.5;
  transition: opacity 0.4s ease;
}
.glass:hover::before { opacity: 1; }

/* 鼠标跟随光晕 */
.tilt-card { will-change: transform; }
.tilt-card::after {
  content: '';
  position: absolute; inset: 0;
  border-radius: inherit;
  pointer-events: none;
  background: radial-gradient(280px circle at var(--mx, 50%) var(--my, 50%),
              rgba(255,255,255,0.1), transparent 65%);
  opacity: 0;
  transition: opacity 0.25s ease;
}
.tilt-card:hover::after { opacity: 1; }

.tilt-card { transition: box-shadow 0.2s ease, filter 0.6s ease; }
.tilt-card:hover {
  box-shadow: 0 20px 48px rgba(10,20,40,0.5),
              0 0 0 1px rgba(255,255,255,0.06),
              0 0 38px rgba(77,107,255,0.18);
}

/* v0.8：流体拖尾特效（Canvas 流体光带，沿划动路径流动扩散，非离散波纹） */
.fluid-trail {
  position: fixed; inset: 0;
  pointer-events: none; z-index: 120;
}

/* ============================================================
   入场加载序列
   ============================================================ */
.reveal {
  opacity: 0;
  animation: riseIn 0.6s cubic-bezier(0.2, 0.7, 0.2, 1) forwards;
  animation-delay: var(--d, 0ms);
}
@keyframes riseIn {
  from { opacity: 0; transform: translateY(16px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ============================================================
   页面骨架
   ============================================================ */
.page {
  position: relative; z-index: 1;
  max-width: 1000px;
  margin: 0 auto;
  padding: 22px 20px 26vh;
}

/* ---------- 顶部导航栏 ---------- */
.navbar {
  display: flex; align-items: center; justify-content: space-between;
  gap: 14px; flex-wrap: wrap;
  padding: 10px 16px;
  position: sticky; top: 14px; z-index: 50;
  transition: box-shadow 0.5s ease;
}
/* 改造五：专注时导航栏脉冲光晕 */
.navbar.focus-active {
  animation: navbarFocus 2.6s ease-in-out infinite;
}
@keyframes navbarFocus {
  0%, 100% { box-shadow: 0 0 16px rgba(77,107,255,0.18), inset 0 1px 0 rgba(255,255,255,0.1); }
  50%      { box-shadow: 0 0 34px rgba(77,107,255,0.42), inset 0 1px 0 rgba(255,255,255,0.1); }
}
.brand { display: flex; align-items: center; gap: 10px; }
.brand-logo {
  width: 36px; height: 36px; flex: none;
  border-radius: 11px;
  display: grid; place-items: center;
  color: #fff;
  background: linear-gradient(135deg, var(--accent), #7a5cff 55%, var(--warm));
  box-shadow: 0 6px 18px rgba(77,107,255,0.35);
}
.brand-logo svg.lucide { width: 20px; height: 20px; }
.brand-name { font-size: 18px; font-weight: 600; color: var(--text-primary); letter-spacing: 0.5px; }

/* 站点标签 + 下拉 */
.school-switch { position: relative; }
.school-btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 5px 14px;
  border-radius: var(--radius-pill);
  border: 1px solid rgba(255,235,215,0.14);
  background: rgba(255,255,255,0.05);
  color: var(--text-aux); font-size: 12.5px; font-weight: 500;
  cursor: pointer; transition: all 0.25s ease;
}
.school-btn:hover { color: var(--text-body); border-color: rgba(77,107,255,0.45); }
.school-dot { width: 6px; height: 6px; border-radius: 50%; background: #5fe39b; box-shadow: 0 0 8px #5fe39b; }
.school-caret { width: 8px; height: 8px; border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor; transform: rotate(45deg) translateY(-1px); transition: transform 0.25s ease; }
.school-switch.open .school-caret { transform: rotate(225deg) translateY(-1px); }
.school-menu {
  position: absolute; top: calc(100% + 8px); left: 0;
  min-width: 230px; padding: 8px;
  border-radius: var(--radius-sm);
  opacity: 0; visibility: hidden; transform: translateY(-6px);
  transition: all 0.25s var(--ease-spring);
}
.school-switch.open .school-menu { opacity: 1; visibility: visible; transform: translateY(0); }
.school-item {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 12px; border-radius: 10px;
  font-size: 13.5px; color: var(--text-body); font-weight: 500;
}
.school-item .cur { font-size: 11px; color: var(--accent); background: rgba(77,107,255,0.16); padding: 2px 10px; border-radius: var(--radius-pill); }
.school-note { display: flex; align-items: center; gap: 6px; padding: 8px 12px; font-size: 12px; color: var(--text-aux); border-top: 1px solid rgba(255,255,255,0.06); margin-top: 4px; }
.school-note svg.lucide { width: 12px; height: 12px; }

.nav-actions { display: flex; align-items: center; gap: 12px; }

.btn-wechat {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 7px 16px;
  border-radius: var(--radius-pill);
  border: 1px solid rgba(255,235,215,0.14);
  background: rgba(255,255,255,0.05);
  color: var(--text-body); font-size: 13px; font-weight: 500;
  cursor: pointer; transition: all 0.25s ease;
}
.btn-wechat svg.lucide { width: 15px; height: 15px; }
.btn-wechat:hover {
  color: #fff; border-color: rgba(95,227,155,0.5);
  background: rgba(95,227,155,0.1);
  box-shadow: 0 6px 20px rgba(95,227,155,0.15);
}

/* ---------- 专注计时器（圆环） ---------- */
.timer {
  position: relative; width: 52px; height: 52px;
  cursor: pointer; user-select: none;
  display: grid; place-items: center;
}
.timer::before {
  content: '';
  position: absolute; inset: -5px;
  border-radius: 50%;
  box-shadow: 0 0 24px 5px rgba(77,107,255,0.35);
  animation: pulseGlow 3s ease-in-out infinite;
}
@keyframes pulseGlow {
  0%, 100% { opacity: 0.22; }
  50%      { opacity: 0.85; }
}
.timer.running::before { animation: none; opacity: 0; box-shadow: 0 0 14px 2px rgba(77,107,255,0.2); }
.timer-svg { width: 52px; height: 52px; transform: rotate(-90deg); }
.ring-progress { transition: stroke-dashoffset 0.3s linear; }
.timer-text {
  position: absolute; inset: 0;
  display: grid; place-items: center;
  font-size: 12px; font-weight: 500; color: var(--text-primary);
  font-variant-numeric: tabular-nums;
  letter-spacing: 0.3px;
}

/* ---------- 功能 Tabs ---------- */
.tabs {
  display: flex; justify-content: center;
  margin: 26px 0 18px;
}
.tabs-bar {
  display: flex; gap: 4px; padding: 5px;
  border-radius: var(--radius-pill);
}
.tab-btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 9px 20px;
  border: none; border-radius: var(--radius-pill);
  background: transparent;
  color: var(--text-aux); font-size: 14px; font-weight: 500;
  font-family: inherit; cursor: pointer;
  transition: all 0.3s ease;
  white-space: nowrap;
}
.tab-btn svg.lucide { width: 15px; height: 15px; }
.tab-btn:hover { color: var(--text-body); }
.tab-btn.active {
  color: var(--text-primary);
  background: rgba(255,255,255,0.09);
  box-shadow: inset 0 0 0 1px rgba(255,235,215,0.1);
}

.panel { display: none; }
.panel.active { display: block; }

/* ---------- 改造七：功能面板返回首页按钮 ---------- */
.panel-head { display: flex; margin-bottom: 14px; }
.btn-back {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 14px;
  border-radius: var(--radius-pill);
  border: 1px solid rgba(255,235,215,0.14);
  background: rgba(255,255,255,0.05);
  color: var(--text-aux); font-size: 12.5px; font-weight: 500; font-family: inherit;
  cursor: pointer; transition: all 0.25s ease;
}
.btn-back svg.lucide { width: 13px; height: 13px; }
.btn-back:hover { color: var(--text-primary); border-color: rgba(77,107,255,0.45); background: rgba(77,107,255,0.1); }

/* ============================================================
   改造二 · 首页（B 端仪表盘风格 · v0.5 精简：仅四入口 + 时间/天气/专注）
   ============================================================ */
.home-hero { text-align: center; padding: 14px 0 18px; }
.home-logo {
  width: 54px; height: 54px; margin: 0 auto 12px;
  border-radius: 17px;
  display: grid; place-items: center;
  color: #fff;
  background: linear-gradient(135deg, var(--accent), #7a5cff 55%, var(--warm));
  box-shadow: 0 12px 36px rgba(77,107,255,0.4);
}
.home-logo svg.lucide { width: 28px; height: 28px; }
/* v0.6：主标题整体渐变（白 → 浅紫蓝 → 靛紫），层级强化 */
.home-title {
  font-size: 28px; font-weight: 600;
  letter-spacing: -0.02em; line-height: 1.15;
  background: linear-gradient(135deg, #ffffff 0%, #c7d2fe 55%, #818cf8 100%);
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent; color: transparent;
}
.home-title .grad { font-weight: 500; }
.home-sub { margin-top: 8px; font-size: 13px; color: var(--text-aux); }

.home-cards {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
  gap: 20px;                    /* v0.6：增大间距，呼吸感 */
  margin-top: 4px;
}
.home-card {
  text-align: left;
  padding: 30px 28px;           /* v0.6：内边距加大 */
  border-radius: var(--radius-lg);
  cursor: pointer;
  display: flex; flex-direction: column; gap: 10px;
  font-family: inherit;
  color: var(--text-body);
}
.hc-icon {
  width: 50px; height: 50px;
  border-radius: 15px;
  display: grid; place-items: center;
  color: #c6d0ff;
  background: linear-gradient(135deg, rgba(77,107,255,0.22), rgba(255,185,128,0.12));
  border: 1px solid rgba(255,235,215,0.12);
}
.hc-icon svg.lucide { width: 24px; height: 24px; }
.hc-name { font-size: 17px; font-weight: 600; color: var(--text-primary); }
.hc-desc { font-size: 12.5px; color: var(--text-aux); line-height: 1.6; flex: 1; }
.hc-go {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 12.5px; font-weight: 500; color: var(--accent);
  opacity: 0.75; transition: all 0.25s ease;
}
.hc-go svg.lucide { width: 13px; height: 13px; }
.home-card:hover .hc-go { opacity: 1; gap: 7px; }

/* v0.6：底部信息栏 → 悬浮胶囊状态岛（fixed 常驻，独立于内容区） */
.home-status {
  position: fixed;
  bottom: 24px; left: 50%;
  transform: translateX(-50%);
  z-index: 90;
  display: flex; align-items: center; gap: 26px;
  padding: 9px 26px;
  border-radius: var(--radius-pill);
  background: rgba(13, 15, 22, 0.72);
  border: 1px solid rgba(255,255,255,0.09);
  backdrop-filter: blur(30px) saturate(140%);
  -webkit-backdrop-filter: blur(30px) saturate(140%);
  box-shadow: 0 10px 36px rgba(5, 8, 18, 0.5), inset 0 1px 0 rgba(255,255,255,0.08);
  max-width: calc(100vw - 32px);
}
.status-card {
  display: flex; align-items: center; gap: 10px;
  min-width: 0;
}
.status-card .st-icon {
  width: 32px; height: 32px;
  border-radius: 10px;
}
.status-card .st-icon svg.lucide { width: 16px; height: 16px; }
.status-card .st-time { font-size: 13px; white-space: nowrap; }
.status-card .st-sub { font-size: 10.5px; }
.focus-btn { padding: 4px 12px; font-size: 11.5px; }
.focus-hist { font-size: 11px; }
.st-icon {
  width: 40px; height: 40px; flex: none;
  border-radius: 12px;
  display: grid; place-items: center;
  color: #c6d0ff;
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,235,215,0.1);
}
.st-icon svg.lucide { width: 20px; height: 20px; }
.st-body { min-width: 0; flex: 1; }
.st-time {
  font-size: 15px; font-weight: 600; color: var(--text-primary);
  font-variant-numeric: tabular-nums; line-height: 1.4;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.st-sub { font-size: 11.5px; color: var(--text-aux); margin-top: 2px; }
.st-sub-row { display: flex; align-items: center; gap: 8px; margin-top: 4px; flex-wrap: wrap; }
.focus-btn {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 5px 13px;
  border-radius: var(--radius-pill);
  border: 1px solid rgba(77,107,255,0.4);
  background: rgba(77,107,255,0.12);
  color: #aab8ff; font-size: 12px; font-weight: 500; font-family: inherit;
  cursor: pointer; transition: all 0.25s ease;
}
.focus-btn svg.lucide { width: 12px; height: 12px; }
.focus-btn:hover { background: rgba(77,107,255,0.24); color: #fff; box-shadow: 0 6px 18px rgba(77,107,255,0.25); }
.focus-hist {
  display: inline-flex; align-items: center; gap: 5px;
  border: none; background: transparent;
  color: var(--text-aux); font-size: 11.5px; font-family: inherit;
  cursor: pointer; transition: color 0.25s ease;
}
.focus-hist svg.lucide { width: 12px; height: 12px; }
.focus-hist:hover { color: var(--text-body); }
.weather-loading { opacity: 0.6; }

/* ============================================================
   Tab 1 · 答疑区（对话流 + 侧边刻度滑条 + 语音输入）
   ============================================================ */
.chat-layout { display: flex; gap: 12px; align-items: stretch; }
.chat-card { flex: 1; min-width: 0; overflow: hidden; display: flex; flex-direction: column; }
.chat-scroll {
  position: relative;
  flex: 1;
  height: clamp(400px, calc(100vh - 330px), 640px);
  overflow-y: auto;
  padding: 22px 22px 10px;
  display: flex; flex-direction: column; gap: 16px;
}

.msg { display: flex; gap: 10px; align-items: flex-end; max-width: 82%; }
.msg-user { align-self: flex-end; flex-direction: row-reverse; }
.avatar {
  width: 28px; height: 28px; flex: none;
  border-radius: 9px;
  display: grid; place-items: center;
  font-size: 13px; font-weight: 600; color: #fff;
  background: linear-gradient(135deg, var(--accent), #7a5cff);
}
.bubble {
  padding: 11px 16px;
  font-size: 14px; line-height: 1.7;
  animation: msgIn 0.35s var(--ease-spring);
}
@keyframes msgIn {
  from { opacity: 0; transform: translateY(8px) scale(0.97); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}
.msg-ai .bubble {
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,235,215,0.1);
  color: var(--text-body);
  border-radius: 4px 16px 16px 16px;
}
.msg-user .bubble {
  background: linear-gradient(135deg, rgba(77,107,255,0.38), rgba(77,107,255,0.16));
  border: 1px solid rgba(77,107,255,0.35);
  color: var(--text-primary);
  border-radius: 16px 4px 16px 16px;
}

.typing { display: flex; gap: 5px; align-items: center; padding: 14px 18px; }
.typing i {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--text-aux);
  animation: typingBounce 1s ease-in-out infinite;
}
.typing i:nth-child(2) { animation-delay: 0.15s; }
.typing i:nth-child(3) { animation-delay: 0.3s; }
@keyframes typingBounce {
  0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
  30% { transform: translateY(-5px); opacity: 1; }
}

/* 侧边刻度滑条：滚动时显示，1.5s 后自动隐藏 */
.chat-ruler {
  flex: none; width: 8px;
  position: relative;
  border-radius: var(--radius-pill);
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,235,215,0.08);
  margin: 6px 0;
  cursor: pointer;
  opacity: 0;
  transition: opacity 0.35s ease, width 0.3s ease;
}
.chat-ruler.show { opacity: 1; }
.chat-ruler:hover { width: 10px; }
.ruler-tick {
  position: absolute; left: 0; right: 0;
  height: 12px;
  transform: translateY(-50%);
  display: grid; place-items: center;
  cursor: pointer;
}
.ruler-tick::before {
  content: '';
  width: 4px; height: 4px; border-radius: 50%;
  background: rgba(255,255,255,0.18);
  transition: all 0.25s ease;
}
.ruler-tick:hover::before { width: 8px; height: 8px; background: rgba(255,255,255,0.5); }
.ruler-tick.active::before {
  width: 8px; height: 8px;
  background: linear-gradient(180deg, var(--accent), var(--warm));
  box-shadow: 0 0 10px rgba(77,107,255,0.6);
}

/* 底部输入区 */
.chat-form {
  display: flex; gap: 10px; align-items: center;
  margin-top: 14px; padding: 8px 10px;
  border-radius: var(--radius-pill);
}
.chat-input {
  flex: 1; min-width: 0;
  background: transparent;
  border: none; outline: none;
  color: var(--text-primary);
  font-family: inherit; font-size: 14px;
  padding: 8px 10px;
}
.chat-input::placeholder { color: var(--text-aux); }

.btn-send {
  flex: none;
  display: inline-flex; align-items: center; gap: 6px;
  padding: 8px 22px;
  border: none; border-radius: var(--radius-pill);
  background: linear-gradient(135deg, var(--accent), #6a5cff);
  color: #fff; font-size: 14px; font-weight: 500; font-family: inherit;
  cursor: pointer;
  box-shadow: 0 8px 22px rgba(77,107,255,0.3);
  transition: all 0.25s ease;
}
.btn-send svg.lucide { width: 14px; height: 14px; }
.btn-send:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 12px 28px rgba(77,107,255,0.42); }
.btn-send:active:not(:disabled) { transform: translateY(0) scale(0.96); }
.btn-send:disabled { opacity: 0.32; cursor: not-allowed; box-shadow: none; }

.btn-mic {
  flex: none; width: 40px; height: 40px;
  border-radius: 50%;
  border: 1px solid rgba(255,235,215,0.14);
  background: rgba(255,255,255,0.05);
  color: var(--text-aux);
  cursor: pointer; transition: all 0.25s ease;
  display: grid; place-items: center;
}
.btn-mic svg.lucide { width: 17px; height: 17px; }
.btn-mic:hover { color: var(--text-primary); border-color: rgba(77,107,255,0.45); }
.btn-mic.listening {
  color: #fff;
  background: rgba(77,107,255,0.28);
  border-color: rgba(77,107,255,0.6);
  animation: micPulse 1.2s ease-in-out infinite;
}
@keyframes micPulse {
  0%, 100% { box-shadow: 0 0 0 4px rgba(77,107,255,0.1); }
  50%      { box-shadow: 0 0 0 10px rgba(77,107,255,0.22); }
}

/* ============================================================
   Tab 2 · 资源库
   ============================================================ */
.sub-tabs { display: flex; justify-content: center; margin-bottom: 20px; }
.sub-tabs-bar {
  display: flex; gap: 4px; padding: 4px;
  border-radius: var(--radius-pill);
}
.sub-tab {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 7px 20px;
  border: none; border-radius: var(--radius-pill);
  background: transparent;
  color: var(--text-aux); font-size: 13px; font-weight: 500; font-family: inherit;
  cursor: pointer; transition: all 0.3s ease;
}
.sub-tab svg.lucide { width: 14px; height: 14px; }
.sub-tab:hover { color: var(--text-body); }
.sub-tab.active {
  color: var(--text-primary);
  background: rgba(255,255,255,0.08);
  box-shadow: inset 0 0 0 1px rgba(255,235,215,0.1);
}

/* 资料工具栏 */
.materials-toolbar {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 10px 16px;
  border-radius: var(--radius-sm);
  margin-bottom: 18px;
}
.mt-title { display: inline-flex; align-items: center; gap: 7px; font-size: 13.5px; font-weight: 600; color: var(--text-primary); }
.mt-title svg.lucide { width: 15px; height: 15px; color: var(--accent); }
.mt-count { font-size: 12px; color: var(--text-aux); }
.mt-spacer { flex: 1; }
.tt-btn, .mt-btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 7px 15px;
  border-radius: var(--radius-pill);
  border: 1px solid rgba(77,107,255,0.4);
  background: rgba(77,107,255,0.12);
  color: #aab8ff; font-size: 12.5px; font-weight: 500; font-family: inherit;
  cursor: pointer; transition: all 0.25s ease;
}
.tt-btn svg.lucide, .mt-btn svg.lucide { width: 13px; height: 13px; }
.tt-btn:hover, .mt-btn:hover { background: rgba(77,107,255,0.24); color: #fff; box-shadow: 0 6px 18px rgba(77,107,255,0.25); }
.tt-btn.ghost, .mt-btn.ghost {
  border-color: rgba(255,235,215,0.14);
  background: rgba(255,255,255,0.05);
  color: var(--text-aux);
}
.tt-btn.ghost:hover, .mt-btn.ghost:hover { color: var(--text-body); background: rgba(255,255,255,0.09); box-shadow: none; }

/* v0.5：资料卡片网格布局 + 中心展开动画（进入时逐张从中心散开，互不堆叠） */
.materials-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(225px, 1fr));
  gap: 16px;
}
.material-card.spread-in { animation: spreadIn 0.55s var(--ease-spring) backwards; }
@keyframes spreadIn {
  from { opacity: 0; transform: scale(0.62) translateY(16px); }
  to   { opacity: 1; transform: scale(1) translateY(0); }
}

.material-card {
  padding: 18px;
  border-radius: var(--radius-lg);
  cursor: default;
  display: flex; flex-direction: column; gap: 9px;
}
.material-icon {
  width: 42px; height: 42px;
  border-radius: 12px;
  display: grid; place-items: center;
  color: #c6d0ff;
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,235,215,0.1);
}
.material-icon svg.lucide { width: 20px; height: 20px; }
.material-title { font-size: 14px; font-weight: 600; color: var(--text-primary); line-height: 1.4; }
.material-desc { font-size: 12px; color: var(--text-aux); line-height: 1.6; flex: 1; }
.material-foot { display: flex; align-items: center; justify-content: space-between; margin-top: 2px; gap: 6px; }
.material-size { font-size: 11px; color: var(--text-aux); font-variant-numeric: tabular-nums; }
.btn-download {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 5px 13px;
  border-radius: var(--radius-pill);
  border: 1px solid rgba(77,107,255,0.4);
  background: rgba(77,107,255,0.12);
  color: #aab8ff; font-size: 12px; font-weight: 500; font-family: inherit;
  cursor: pointer; transition: all 0.25s ease;
}
.btn-download svg.lucide { width: 12px; height: 12px; }
.btn-download:hover { background: rgba(77,107,255,0.24); color: #fff; box-shadow: 0 6px 18px rgba(77,107,255,0.25); }
.material-share-tag {
  align-self: flex-start;
  font-size: 10.5px; color: #9fe8bd;
  background: rgba(95,227,155,0.1);
  border: 1px solid rgba(95,227,155,0.25);
  padding: 2px 9px; border-radius: var(--radius-pill);
}
.btn-mdel {
  display: inline-flex; align-items: center;
  width: 26px; height: 26px;
  border-radius: 50%;
  border: 1px solid rgba(255,140,110,0.3);
  background: rgba(255,140,110,0.08);
  color: #ffb4a0;
  cursor: pointer; transition: all 0.25s ease;
  justify-content: center;
}
.btn-mdel svg.lucide { width: 12px; height: 12px; }
.btn-mdel:hover { background: rgba(255,140,110,0.2); color: #fff; }

/* 学长博客 */
.blog-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.blog-header h3 { display: inline-flex; align-items: center; gap: 7px; font-size: 15px; font-weight: 600; color: var(--text-primary); }
.blog-header h3 svg.lucide { width: 16px; height: 16px; color: var(--warm); }
.btn-publish {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 7px 16px;
  border-radius: var(--radius-pill);
  border: 1px solid rgba(255,185,128,0.35);
  background: rgba(255,185,128,0.1);
  color: var(--warm); font-size: 13px; font-weight: 500; font-family: inherit;
  cursor: pointer; transition: all 0.25s ease;
}
.btn-publish svg.lucide { width: 13px; height: 13px; }
.btn-publish:hover { background: rgba(255,185,128,0.18); color: #fff; box-shadow: 0 6px 18px rgba(255,185,128,0.2); }

.blog-list { display: flex; flex-direction: column; gap: 14px; }
.blog-card { padding: 20px 24px; border-radius: var(--radius-lg); }
.blog-img img {
  width: 100%; max-height: 200px; object-fit: cover;
  border-radius: 12px; margin-bottom: 12px;
  border: 1px solid rgba(255,235,215,0.1);
}
.blog-meta { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
.blog-date { font-size: 12px; color: var(--text-aux); font-variant-numeric: tabular-nums; letter-spacing: 0.4px; }
.blog-cat {
  font-size: 11px; color: var(--warm);
  background: rgba(255,185,128,0.1);
  border: 1px solid rgba(255,185,128,0.22);
  padding: 2px 10px; border-radius: var(--radius-pill);
}
.blog-badge {
  font-size: 11px; color: #ffcf8f; font-weight: 500;
  background: rgba(255,185,128,0.12);
  border: 1px solid rgba(255,185,128,0.3);
  padding: 2px 10px; border-radius: var(--radius-pill);
}
/* 标题左侧渐变流光竖线（悬停触发） */
.blog-title { position: relative; font-size: 16px; font-weight: 600; color: var(--text-primary); line-height: 1.5; }
.flow-line {
  position: absolute; left: -16px; top: 50%;
  width: 3px; height: 22px;
  border-radius: 3px;
  background: linear-gradient(180deg, var(--accent), var(--warm), var(--accent));
  background-size: 100% 300%;
  opacity: 0; transform: translateY(-50%) scaleY(0.4);
  transition: opacity 0.3s ease, transform 0.3s var(--ease-spring);
}
.blog-card:hover .flow-line {
  opacity: 1; transform: translateY(-50%) scaleY(1);
  animation: flowLine 1.5s linear infinite;
}
@keyframes flowLine { to { background-position: 0 300%; } }
.blog-summary { margin-top: 8px; font-size: 13px; color: var(--text-aux); line-height: 1.7; }
.blog-foot { display: flex; justify-content: flex-end; margin-top: 10px; }
.blog-like {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 5px 14px;
  border-radius: var(--radius-pill);
  border: 1px solid rgba(255,235,215,0.12);
  background: transparent;
  color: var(--text-aux); font-size: 12.5px; font-family: inherit;
  cursor: pointer; transition: all 0.25s ease;
}
.blog-like svg.lucide { width: 13px; height: 13px; }
.blog-like:hover { color: #ff9db1; border-color: rgba(255,120,150,0.4); }
.blog-like.liked { color: #ff8fa6; background: rgba(255,120,150,0.12); border-color: rgba(255,120,150,0.4); box-shadow: 0 4px 14px rgba(255,120,150,0.15); }
.blog-like.liked svg.lucide { fill: currentColor; }
.new-post { animation: msgIn 0.45s var(--ease-spring); }
/* v0.5：发布成功闪光反馈（每次发布都触发，弹出 + 金色光晕） */
.flash-glow { animation: flashGlow 1.4s ease-out 0.35s 1; }
@keyframes flashGlow {
  0%   { box-shadow: 0 0 0 rgba(255,185,128,0); }
  30%  { box-shadow: 0 0 46px rgba(255,185,128,0.5), 0 0 0 1px rgba(255,185,128,0.45); }
  100% { box-shadow: 0 0 0 rgba(255,185,128,0); }
}

/* ============================================================
   Tab 3 · AI 工坊
   ============================================================ */
.workshop-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 16px;
}
.agent-card {
  padding: 26px 24px;
  border-radius: var(--radius-lg);
  cursor: pointer;
  display: flex; flex-direction: column; gap: 10px;
}
.agent-icon {
  width: 54px; height: 54px;
  border-radius: 16px;
  display: grid; place-items: center;
  color: #c6d0ff;
  background: linear-gradient(135deg, rgba(77,107,255,0.22), rgba(255,185,128,0.14));
  border: 1px solid rgba(255,235,215,0.12);
}
.agent-icon svg.lucide { width: 26px; height: 26px; }
.agent-name { font-size: 16px; font-weight: 600; color: var(--text-primary); }
.agent-desc { font-size: 13px; color: var(--text-aux); line-height: 1.7; flex: 1; }
.agent-tag {
  align-self: flex-start;
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 11.5px; color: var(--warm);
  background: rgba(255,185,128,0.09);
  border: 1px solid rgba(255,185,128,0.22);
  padding: 4px 12px; border-radius: var(--radius-pill);
  font-weight: 500;
}
.agent-tag svg.lucide { width: 11px; height: 11px; }
.agent-hint { font-size: 12px; color: var(--accent); opacity: 0.75; }
.agent-card:hover .agent-hint { opacity: 1; }

/* ============================================================
   Tab 4 · 课表
   ============================================================ */
.tt-toolbar {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 12px 16px;
  border-radius: var(--radius-sm);
  margin-bottom: 16px;
}
.tt-title { display: inline-flex; align-items: center; gap: 7px; font-size: 14px; font-weight: 600; color: var(--text-primary); }
.tt-title svg.lucide { width: 15px; height: 15px; color: var(--accent); }
.tt-spacer { flex: 1; }

.tt-error {
  display: flex; align-items: center; gap: 8px;
  margin-bottom: 14px;
  padding: 12px 16px;
  border-radius: var(--radius-sm);
  background: rgba(255,140,110,0.08);
  border: 1px solid rgba(255,140,110,0.3);
  color: #ffb4a0;
  font-size: 13px;
  line-height: 1.7;
}
.tt-error svg.lucide { width: 14px; height: 14px; flex: none; }

.timetable { overflow: hidden; }
.tt-bg { background-size: cover; background-position: center; }
.tt-bg .tt-bg-layer {
  background: linear-gradient(165deg, rgba(8,10,10,0.55), rgba(8,10,10,0.72));
  backdrop-filter: var(--blur);
  -webkit-backdrop-filter: var(--blur);
}
.tt-scroll { overflow-x: auto; padding: 4px; }
.tt-grid {
  width: 100%; min-width: 760px;
  border-collapse: collapse;
  table-layout: fixed;
}
.tt-grid th, .tt-grid td {
  border: 1px solid rgba(255,235,215,0.07);
  padding: 10px 8px;
  font-size: 12.5px;
  text-align: center;
  vertical-align: top;
}
.tt-grid thead th { font-weight: 500; color: var(--text-body); background: rgba(255,255,255,0.03); line-height: 1.5; }
.tt-day-header.today { color: #fff; background: rgba(77,107,255,0.18); box-shadow: inset 0 -2px 0 var(--accent); }
.tt-today { display: block; font-size: 10px; color: #aab8ff; margin-top: 2px; }
.tt-no { display: block; font-size: 10px; color: var(--text-aux); margin-top: 2px; }
.tt-corner { width: 86px; }
.tt-period { font-size: 12px; color: var(--text-aux); background: rgba(255,255,255,0.02); line-height: 1.6; }
.tt-pg { display: block; font-size: 10px; color: var(--text-aux); opacity: 0.7; }
.tt-course {
  display: inline-block;
  margin: 2px;
  padding: 5px 10px;
  border-radius: 8px;
  background: rgba(77,107,255,0.14);
  border: 1px solid rgba(77,107,255,0.3);
  color: #cdd6ff;
  font-size: 12px;
  line-height: 1.5;
  text-align: left;
  /* v0.6：悬停上浮 + 外发光（课表玻璃化增强） */
  transition: transform 0.25s var(--ease-spring), box-shadow 0.25s ease, border-color 0.25s ease, background 0.25s ease;
}
.tt-course:hover {
  transform: translateY(-2px);
  background: rgba(77,107,255,0.22);
  border-color: rgba(77,107,255,0.55);
  box-shadow: 0 6px 18px rgba(77,107,255,0.28);
}
.tt-room { display: block; font-size: 10.5px; color: var(--text-aux); margin-top: 2px; }
.tt-empty { color: var(--text-aux); font-size: 11.5px; }

/* 导入中心 / 班级查询 / 背景：弹窗内子面板 */
.imp-tabs { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; justify-content: center; }
.imp-tab {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 7px 15px;
  border-radius: var(--radius-pill);
  border: 1px solid rgba(255,235,215,0.14);
  background: rgba(255,255,255,0.04);
  color: var(--text-aux); font-size: 12.5px; font-weight: 500; font-family: inherit;
  cursor: pointer; transition: all 0.25s ease;
}
.imp-tab svg.lucide { width: 13px; height: 13px; }
.imp-tab:hover { color: var(--text-body); }
.imp-tab.active { color: var(--text-primary); background: rgba(77,107,255,0.16); border-color: rgba(77,107,255,0.4); }
.imp-pane { display: none; text-align: left; }
.imp-pane.active { display: block; }
.imp-steps { font-size: 12.5px; color: var(--text-aux); line-height: 1.9; margin-bottom: 12px; }
.imp-steps b { color: var(--text-body); font-weight: 500; }
.imp-textarea {
  width: 100%;
  padding: 12px 14px;
  border-radius: 12px;
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,235,215,0.12);
  color: var(--text-primary);
  font-family: inherit; font-size: 13px;
  outline: none; resize: vertical;
  line-height: 1.8;
  min-height: 140px;
}
.imp-textarea:focus { border-color: rgba(77,107,255,0.5); }
.imp-url {
  width: 100%;
  padding: 10px 14px;
  border-radius: 12px;
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,235,215,0.12);
  color: var(--text-primary);
  font-family: inherit; font-size: 13px;
  outline: none;
}
.imp-url:focus { border-color: rgba(77,107,255,0.5); }
.imp-row { display: flex; align-items: center; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
.imp-note { display: flex; align-items: flex-start; gap: 6px; font-size: 11.5px; color: var(--text-aux); line-height: 1.7; margin-top: 10px; }
.imp-note svg.lucide { width: 12px; height: 12px; flex: none; margin-top: 2px; }
.tt-preview-name { font-size: 13px; font-weight: 600; color: var(--text-primary); margin-bottom: 10px; text-align: center; }
.tt-preview-name small { display: block; font-weight: 400; font-size: 11.5px; color: var(--text-aux); margin-top: 4px; }

/* ============================================================
   v0.6 · 图标容器统一升级（渐变底座 + 光晕 + 浅紫蓝）
   ============================================================ */
.hc-icon, .material-icon, .agent-icon, .st-icon, .modal-icon {
  background: linear-gradient(135deg, rgba(99,102,241,0.18), rgba(139,92,246,0.08));
  border-color: rgba(99,102,241,0.16);
  box-shadow: 0 0 22px rgba(99,102,241,0.09), inset 0 1px 0 rgba(255,255,255,0.07);
}
.hc-icon svg.lucide, .material-icon svg.lucide, .agent-icon svg.lucide,
.st-icon svg.lucide, .modal-icon svg.lucide {
  color: #a5b4fc;
}

/* ============================================================
   弹窗（Modal）
   ============================================================ */
.modal-mask {
  position: fixed; inset: 0; z-index: 100;
  display: grid; place-items: center;
  background: rgba(0,0,0,0.5);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  opacity: 0; visibility: hidden;
  transition: opacity 0.3s ease, visibility 0.3s ease;
}
.modal-mask.show { opacity: 1; visibility: visible; }
.modal {
  width: min(460px, calc(100vw - 48px));
  max-height: 82vh;
  overflow-y: auto;
  padding: 28px 26px 22px;
  text-align: center;
  transform: scale(0.92) translateY(10px);
  transition: transform 0.35s var(--ease-spring);
}
.modal-mask.show .modal { transform: scale(1) translateY(0); }
.modal-icon {
  width: 52px; height: 52px; margin: 0 auto 14px;
  border-radius: 16px;
  display: grid; place-items: center;
  color: #c6d0ff;
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,235,215,0.1);
}
.modal-icon svg.lucide { width: 24px; height: 24px; }
.modal-title { font-size: 17px; font-weight: 600; color: var(--text-primary); }
.modal-body { margin-top: 10px; font-size: 13.5px; color: var(--text-body); line-height: 1.8; }
.modal-actions { margin-top: 22px; display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }

.btn-primary {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 10px 26px;

   ============================================================ */
const Storage = (() => {
  let memory = new Map();
  let usingMemory = false;
  function canUseLS() {
    try {
      localStorage.setItem('wenzhou__probe', '1');
      localStorage.removeItem('wenzhou__probe');
      return true;
    } catch (e) { return false; }
  }
  const lsOK = canUseLS();
  return {
    isMemory: () => usingMemory,
    get(key) {
      if (lsOK) {
        try {
          const raw = localStorage.getItem(key);
          return raw ? JSON.parse(raw) : null;
        } catch (e) { return null; }
      }
      return memory.has(key) ? memory.get(key) : null;
    },
    set(key, value) {
      if (lsOK) {
        try {
          localStorage.setItem(key, JSON.stringify(value));
          return true;
        } catch (e) {
          AppErrorHandler.handleStorageError(e);
          usingMemory = true;
        }
      }
      memory.set(key, value);
      return false;
    },
    remove(key) {
      if (lsOK) { try { localStorage.removeItem(key); } catch (e) { /* 忽略 */ } }
      memory.delete(key);
    },
  };
})();

/* IndexedDB：用户上传资料 */
const IDB = (() => {
  let db = null;
  function open() {
    return new Promise((resolve, reject) => {
      if (db) return resolve(db);
      const req = indexedDB.open('wenzhou', 1);
      req.onupgradeneeded = () => {
        if (!req.result.objectStoreNames.contains('materials')) {
          req.result.createObjectStore('materials', { keyPath: 'id' });
        }
      };
      req.onsuccess = () => { db = req.result; resolve(db); };
      req.onerror = () => reject(req.error);
    });
  }
  function tx(store, mode) {
    return open().then(d => d.transaction(store, mode).objectStore(store));
  }
  return {
    async all() {
      try {
        const s = await tx('materials', 'readonly');
        return await new Promise((res, rej) => { const r = s.getAll(); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
      } catch (e) { AppErrorHandler.handleFileError(e, '读取上传资料'); return []; }
    },
    async add(item) {
      try {
        const s = await tx('materials', 'readwrite');
        return await new Promise((res, rej) => { const r = s.add(item); r.onsuccess = () => res(item); r.onerror = () => rej(r.error); });
      } catch (e) { AppErrorHandler.handleFileError(e, '保存上传资料'); return null; }
    },
    async put(item) {
      try {
        const s = await tx('materials', 'readwrite');
        return await new Promise((res, rej) => { const r = s.put(item); r.onsuccess = () => res(item); r.onerror = () => rej(r.error); });
      } catch (e) { AppErrorHandler.handleFileError(e, '导入资料'); return null; }
    },
    async remove(id) {
      try {
        const s = await tx('materials', 'readwrite');
        return await new Promise((res, rej) => { const r = s.delete(id); r.onsuccess = () => res(); r.onerror = () => rej(r.error); });
      } catch (e) { AppErrorHandler.handleFileError(e, '删除资料'); }
    },
  };
})();

};

/* PDF.js 懒加载 */
function loadPdfJs() {
  if (window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
  const SOURCES = [
    'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js',
    'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js',
  ];
  return new Promise((resolve, reject) => {
    let i = 0;
    const tryLoad = () => {
      if (i >= SOURCES.length) { reject(new Error('PDF.js 加载失败')); return; }
      const s = document.createElement('script');
      s.src = SOURCES[i++];
      s.onload = () => {
        window.pdfjsLib.GlobalWorkerOptions.workerSrc =
          'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        resolve(window.pdfjsLib);
      };
      s.onerror = tryLoad;
      document.head.appendChild(s);
    };
    tryLoad();
  });
}

/* SheetJS 懒加载（Excel 导入） */
function loadXlsx() {
  if (window.XLSX) return Promise.resolve(window.XLSX);
  const SOURCES = [
    'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js',
    'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js',
  ];
  return new Promise((resolve, reject) => {
    let i = 0;
    const tryLoad = () => {
      if (i >= SOURCES.length) { reject(new Error('Excel 解析库加载失败')); return; }
      const s = document.createElement('script');
      s.src = SOURCES[i++];
      s.onload = () => resolve(window.XLSX);
      s.onerror = tryLoad;
      document.head.appendChild(s);
    };
    tryLoad();
  });
}

/* @__PURE__ */ const WEATHER_CACHE_MS = 30 * 60 * 1000;   // 缓存 30 分钟
async function initWeather() {
  if (!APP_CONFIG.features.homeWeather) return;
  const render = (w) => {
    const [ic, desc] = WEATHER_MAP[w.code] || ['cloud', '未知'];
    const iconEl = $('#weatherIcon');
    if (iconEl) iconEl.innerHTML = `<i data-lucide="${ic}"></i>`;
    const info = $('#weatherInfo');
    if (info) {
      info.textContent = `${Math.round(w.temp)}° · ${desc}`;
      info.classList.remove('weather-loading');
    }
    refreshIcons();
  };
  const cached = Storage.get(KEYS.weather);
  if (cached && Date.now() - cached.ts < WEATHER_CACHE_MS) { render(cached); return; }
  try {
    const res = await fetch('https://api.open-meteo.com/v1/forecast?latitude=30.59&longitude=114.27&current=temperature_2m,weather_code&timezone=Asia/Shanghai');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const j = await res.json();

  ruler.hidden = false;

function compressImage(file, maxW = 800, quality = 0.82) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      const scale = Math.min(1, maxW / img.width);
      const canvas = document.createElement('canvas');
      canvas.width = Math.max(1, Math.round(img.width * scale));
      canvas.height = Math.max(1, Math.round(img.height * scale));
      canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
      URL.revokeObjectURL(url);
      resolve(canvas.toDataURL('image/jpeg', quality));
    };
    img.onerror = (e) => { URL.revokeObjectURL(url); reject(e); };
    img.src = url;
  });
}

function initVoice() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const mic = $('#micBtn');
  if (!APP_CONFIG.features.voice || !SR) { mic.style.display = 'none'; return; }
  let rec = null, listening = false, timeout = null;
  mic.addEventListener('click', () => {
    if (listening) { rec.stop(); return; }
    try {
      rec = new SR();
      rec.lang = 'zh-CN';
      rec.interimResults = false;
      rec.maxAlternatives = 1;
      rec.onstart = () => {
        listening = true;
        mic.classList.add('listening');
        chatInput.placeholder = '正在聆听...';
        timeout = setTimeout(() => rec.stop(), 5000);
      };
      rec.onresult = (e) => {
        const t = e.results[0][0].transcript;
        chatInput.value = t;
        sendBtn.disabled = !t.trim();
      };
      rec.onerror = (e) => {
        if (e.error === 'no-speech') showToast('未检测到语音，已自动取消', 'mic');
        else if (e.error === 'not-allowed') showToast('麦克风权限被拒绝，请检查浏览器设置', 'alert-triangle');
      };
      rec.onend = () => {
        listening = false;
        mic.classList.remove('listening');
        chatInput.placeholder = CHAT_PLACEHOLDER;
        clearTimeout(timeout);
      };
      rec.start();
    } catch (err) {
      AppErrorHandler.handleFileError(err, '语音识别启动');
    }
  });
}

  if (['ppt', 'pptx'].includes(ext)) return 'presentation';
  if (['doc', 'docx', 'pdf', 'txt', 'md'].includes(ext)) return 'file-text';
  if (['xls', 'xlsx', 'csv'].includes(ext)) return 'clipboard-list';
  if (['py', 'js', 'ts', 'c', 'cpp', 'java', 'html', 'css'].includes(ext)) return 'code';
  return 'file';
}

function setTimerUi() {
  timerEl.classList.toggle('running', timer.running);
  navbarEl.classList.toggle('focus-active', timer.running);   // 导航栏脉冲光晕
}
function toggleTimer() {
  if (timer.done) { timer.done = false; timer.remaining = timer.total; }
  if (!timer.running) {
    timer.running = true;
    timer.endAt = Date.now() + timer.remaining * 1000;
    timer.tick = setInterval(onTimerTick, 250);
  } else {
    timer.running = false;
    clearInterval(timer.tick);
    timer.remaining = Math.max(0, Math.round((timer.endAt - Date.now()) / 1000));
  }
  setTimerUi();
  renderRing();
  updateFocusCard();
}
function onTimerTick() {
  timer.remaining = Math.max(0, Math.round((timer.endAt - Date.now()) / 1000));
  renderRing();
  if (timer.remaining <= 0) {
    clearInterval(timer.tick);
    timer.running = false;
    timer.done = true;
    setTimerUi();
    recordFocus();                        // 记录专注历史
    updateFocusCard();
    showToast('专注结束，休息一下吧', 'brain');
  }
}

/* 课表文本解析：自动适配常见排版（含教室提取） */
/* @__PURE__ */ function parseTimetableText(text) {
  const DAY_MAP = { '一': 0, '二': 1, '三': 2, '四': 3, '五': 4, '六': 5, '日': 6, '天': 6 };
  const entries = [];
  const lines = String(text).split(/\r?\n/);
  for (const raw of lines) {
    const line = raw.trim();
    if (!line) continue;
    let day, pLo, pHi, name, room = '';
    let m = line.match(/(?:周|星期)([一二三四五六日天])[\s:：]*(?:第)?(\d{1,2})\s*[-—–~至]\s*(\d{1,2})\s*节?[\s:：]*([^\s|,，。]{1,24})/);
    if (m) { day = DAY_MAP[m[1]]; pLo = +m[2]; pHi = +m[3]; name = m[4]; room = line.slice(m.index + m[0].length).trim().replace(/[（）()]/g, ''); }
    if (!m) {
      m = line.match(/(?:周|星期)([一二三四五六日天])[\s:：]*([^\s|,，。]{1,24})[\s:：]*(?:第)?(\d{1,2})\s*[-—–~至]\s*(\d{1,2})\s*节?/);
      if (m) { day = DAY_MAP[m[1]]; name = m[2]; pLo = +m[3]; pHi = +m[4]; room = line.slice(m.index + m[0].length).trim().replace(/[（）()]/g, ''); }
    }
    if (!m) {
      m = line.match(/(?:第)?(\d{1,2})\s*[-—–~至]\s*(\d{1,2})\s*节?[\s:：]*([^\s|,，。]{1,24})[\s:：]*(?:周|星期)([一二三四五六日天])/);
      if (m) { day = DAY_MAP[m[4]]; pLo = +m[1]; pHi = +m[2]; name = m[3]; room = ''; }
    }
    if (day === undefined || !m) continue;
    const lo = Math.min(pLo, pHi), hi = Math.max(pLo, pHi);
    const period = Math.floor(((lo + hi) / 2 - 1) / 2);
    if (period < 0 || period > 4) continue;
    const course = String(name || '').replace(/[（）()]/g, '');
    if (!course || /^\d+$/.test(course) || /(节|课表|教室|星期|周|第)/.test(course)) continue;
    entries.push({ day, period, name: course, room });
  }
  return entries;
}

function mergeTimetable(entries) {
  const tt = getTimetable();
  for (const e of entries) {
    if (!tt.some(c => c.day === e.day && c.period === e.period && c.name === e.name)) tt.push(e);
  }
  return tt;
}

function applyParsed(entries, sourceLabel) {
  if (!entries.length) throw new Error('未识别到课表内容');
  const merged = mergeTimetable(entries);
  Storage.set(KEYS.timetable, merged);
  renderTimetable();
  $('#ttErrorBox').style.display = 'none';
  hideModal();
  showToast(`解析成功：识别到 ${entries.length} 门课程（${sourceLabel}）`, 'calendar-days');
}

function importPdfFile() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'application/pdf';
  input.onchange = async () => {
    const file = input.files[0];
    if (!file) return;
    if (file.type !== 'application/pdf' && !/\.pdf$/i.test(file.name)) {
      showToast('请选择 PDF 文件', 'alert-triangle');
      AppErrorHandler.handleFileError(new Error('非 PDF 文件'), '课表导入');
      return;
    }
    try {
      const pdfjs = await loadPdfJs();
      const buf = await file.arrayBuffer();
      const pdf = await pdfjs.getDocument({ data: buf }).promise;
      let text = '';
      for (let i = 1; i <= pdf.numPages; i++) {
        const page = await pdf.getPage(i);
        const tc = await page.getTextContent();
        text += tc.items.map(it => it.str).join(' ') + '\n';
      }
      const entries = parseTimetableText(text);
      applyParsed(entries, 'PDF');
    } catch (err) {
      AppErrorHandler.handleFileError(err, '课表解析');
      $('#ttErrorBox').style.display = 'block';
    }
  };
  input.click();
}

/* ---------- 流体拖尾特效（v0.8：Canvas 流体光带，像水被划开一样流动） ---------- */
function initFluidTrail() {
  if (!APP_CONFIG.features.ripple) return;
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

  const canvas = document.createElement('canvas');
  canvas.className = 'fluid-trail';
  document.body.appendChild(canvas);
  const ctx = canvas.getContext('2d');

  let w = 0, h = 0, dpr = 1;
  function resize() {
    dpr = window.devicePixelRatio || 1;
    w = window.innerWidth; h = window.innerHeight;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resize();
  window.addEventListener('resize', resize);

  const points = [];          // 路径点 {x, y, life}，life 0..1
  let drawing = false;
  let rafId = null;

  function push(x, y) {
    points.push({ x, y, life: 1 });
    if (points.length > 60) points.shift();   // 限制长度，路径跟随鼠标
  }

  function kick() {
    if (rafId === null) rafId = requestAnimationFrame(step);
  }
  function step() {
    // 生命衰减：拖拽中缓慢（保持稳定），松手后快速消散
    const decay = drawing ? 0.012 : 0.05;
    for (let i = points.length - 1; i >= 0; i--) {
      points[i].life -= decay;
      if (points[i].life <= 0) points.splice(i, 1);
    }
    draw();
    if (points.length > 0 || drawing) {
      rafId = requestAnimationFrame(step);
    } else {
      rafId = null;
      ctx.clearRect(0, 0, w, h);
    }
  }

  /* 绘制流体光带：平滑路径 + 波动边缘 + 渐变填充 + 中心亮线 */
  function draw() {
    ctx.clearRect(0, 0, w, h);
    const n = points.length;
    if (n < 2) return;

    // 移动平均平滑路径
    const pts = [];
    for (let i = 0; i < n; i++) {
      let sx = 0, sy = 0, c = 0;
      for (let j = Math.max(0, i - 2); j <= Math.min(n - 1, i + 2); j++) { sx += points[j].x; sy += points[j].y; c++; }
      pts.push({ x: sx / c, y: sy / c, life: points[i].life });
    }

    // 波动边缘：法线方向 + 正弦扰动（流体感的关键）
    const left = [], right = [];
    for (let i = 0; i < pts.length; i++) {
      const p = pts[i];
      const prev = pts[Math.max(0, i - 1)];
      const next = pts[Math.min(pts.length - 1, i + 1)];
      let dx = next.x - prev.x, dy = next.y - prev.y;
      const len = Math.hypot(dx, dy) || 1;
      dx /= len; dy /= len;
      const nx = -dy, ny = dx;
      const t = i / Math.max(1, pts.length - 1);
      const wave = Math.sin(i * 0.55) * (1.5 + 4 * t);       // 尾部波动更大
      const half = Math.max(0.5, (3 + 7 * t) * p.life);      // 尾部加宽，随生命收窄
      left.push({ x: p.x + nx * (half + wave), y: p.y + ny * (half + wave) });
      right.push({ x: p.x - nx * (half + wave), y: p.y - ny * (half + wave) });
    }

    // 流体带填充（沿路径渐变，头部淡入、尾部明显）
    ctx.beginPath();
    ctx.moveTo(left[0].x, left[0].y);
    for (let i = 1; i < left.length; i++) ctx.lineTo(left[i].x, left[i].y);
    for (let i = right.length - 1; i >= 0; i--) ctx.lineTo(right[i].x, right[i].y);
    ctx.closePath();
    const grad = ctx.createLinearGradient(pts[0].x, pts[0].y, pts[pts.length - 1].x, pts[pts.length - 1].y);
    grad.addColorStop(0, 'rgba(150, 190, 255, 0.02)');
    grad.addColorStop(0.55, 'rgba(165, 200, 255, 0.26)');
    grad.addColorStop(1, 'rgba(190, 215, 255, 0.4)');
    ctx.fillStyle = grad;
    ctx.fill();

    // 中心亮线（水流核心）
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
    ctx.strokeStyle = 'rgba(225, 240, 255, 0.5)';
    ctx.lineWidth = 1.4;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.stroke();
  }

  /* 交互：按住拖动生成流体，单点产生短促流体脉冲 */
  let lastX = 0, lastY = 0;
  window.addEventListener('pointerdown', (e) => {
    drawing = true;
    lastX = e.clientX; lastY = e.clientY;
    push(e.clientX, e.clientY);
    for (let i = 0; i < 4; i++) {
      push(e.clientX + (Math.random() - 0.5) * 12, e.clientY + (Math.random() - 0.5) * 12);
    }
    kick();
  }, { passive: true });
  window.addEventListener('pointermove', (e) => {
    if (!drawing) return;
    const dx = e.clientX - lastX, dy = e.clientY - lastY;
    const dist = Math.hypot(dx, dy);
    if (dist > 6) {
      const steps = Math.min(5, Math.floor(dist / 6));
      for (let i = 1; i <= steps; i++) push(lastX + dx * i / steps, lastY + dy * i / steps);
      lastX = e.clientX; lastY = e.clientY;
      kick();
    }
  }, { passive: true });
  const stop = () => { drawing = false; kick(); };
  window.addEventListener('pointerup', stop);
  window.addEventListener('pointercancel', stop);
}

/* ---------- 鼠标跟随 3D 倾斜（v0.5：支持增量绑定，资料卡片展开动画结束后动态加入） ---------- */
const _tiltStates = new Map();
let _tiltLoopStarted = false;

function bindTilt(root) {
  const cards = [];
  if (root instanceof Element) {
    if (root.classList && root.classList.contains('tilt-card')) cards.push(root);
    cards.push(...root.querySelectorAll('.tilt-card'));
  } else {
    cards.push(...document.querySelectorAll('.tilt-card'));
  }
  cards.forEach(card => {
    if (_tiltStates.has(card)) return;
    const s = {
      rx: 0, ry: 0, trx: 0, try: 0, vrx: 0, vry: 0,
      ly: 0, tly: 0, vly: 0,
      mx: 50, my: 50, tmx: 50, tmy: 50,
    };
    _tiltStates.set(card, s);
    card.addEventListener('mousemove', (e) => {
      const r = card.getBoundingClientRect();
      const px = (e.clientX - r.left) / r.width;
      const py = (e.clientY - r.top) / r.height;
      s.trx = (px - 0.5) * 12;
      s.try = (0.5 - py) * 12;
      s.tmx = px * 100;
      s.tmy = py * 100;
      s.tly = -6;
    });
    card.addEventListener('mouseleave', () => { s.trx = 0; s.try = 0; s.tly = 0; });
  });
  if (!_tiltLoopStarted) {
    _tiltLoopStarted = true;
    let last = performance.now();
    (function loop(now) {
      const dt = Math.min(32, now - last) / 16.7;
      last = now;
      _tiltStates.forEach((s, card) => {
        s.vrx += (s.trx - s.rx) * 0.09 * dt; s.vrx *= 0.78; s.rx += s.vrx;
        s.vry += (s.try - s.ry) * 0.09 * dt; s.vry *= 0.78; s.ry += s.vry;
        s.vly += (s.tly - s.ly) * 0.12 * dt; s.vly *= 0.72; s.ly += s.vly;
        s.mx += (s.tmx - s.mx) * 0.12 * dt;
        s.my += (s.tmy - s.my) * 0.12 * dt;
        card.style.transform =
          `perspective(900px) rotateX(${s.ry.toFixed(2)}deg) rotateY(${s.rx.toFixed(2)}deg) translateY(${s.ly.toFixed(2)}px)`;
        card.style.setProperty('--mx', s.mx.toFixed(1) + '%');
        card.style.setProperty('--my', s.my.toFixed(1) + '%');
      });
      requestAnimationFrame(loop);
    })(performance.now());
  }
}
function initTilt() { bindTilt(document); }

/* ---------- 入场动画收尾 ---------- */
function restartReveal(el) {
  el.classList.remove('reveal');
  void el.offsetWidth;
  el.classList.add('reveal');
}
document.addEventListener('animationend', (e) => {
  if (e.target.classList && e.target.classList.contains('reveal')) {
    e.target.classList.remove('reveal');
  }
});
