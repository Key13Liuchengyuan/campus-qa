<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>武昌首义学院 · 首义学长校园问答</title>
<style>
  /* ============ 新中式校园风 ============ */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --brand: #8B0000;          /* 首义红 */
    --brand2: #B22222;         /* 砖红 */
    --bg: #FDFBF7;             /* 米白 */
    --card: #FFFFFF;
    --text: #2b2b2b;
    --muted: #9aa0a6;
    --line: #f0e6dd;
    --radius: 14px;
    --shadow: 0 6px 24px rgba(139,0,0,0.08);
    --serif: "Songti SC", "STSong", "SimSun", "Noto Serif SC", serif;
    --sans: -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
  }
  html { scroll-behavior: smooth; }
  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* ===== 顶部导航 ===== */
  .nav {
    width: 100%;
    max-width: 860px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 20px 8px;
    flex-wrap: wrap;
    gap: 10px;
  }
  .logo { display: flex; align-items: center; gap: 10px; }
  .logo .emblem {
    width: 40px; height: 40px; border-radius: 12px;
    background: linear-gradient(135deg, var(--brand), var(--brand2));
    color: #fff; font-size: 20px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 12px rgba(139,0,0,0.28);
  }
  .logo .name {
    font-family: var(--serif);
    font-weight: 800; font-size: 21px; color: var(--brand);
    letter-spacing: 1px;
  }
  .logo .name small { font-size: 12px; color: var(--muted); font-weight: 400; margin-left: 6px; font-family: var(--sans); }
  .nav-btns { display: flex; gap: 8px; flex-wrap: wrap; }
  .nav-btns button {
    border: 1.5px solid rgba(139,0,0,0.25);
    background: #fff; color: var(--brand);
    font-size: 13px; font-weight: 600;
    padding: 8px 16px; border-radius: 999px;
    cursor: pointer; transition: all .2s ease;
  }
  .nav-btns button:hover {
    background: var(--brand); color: #fff;
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(139,0,0,0.25);
  }
  .nav-btns button.admin { background: var(--brand); color: #fff; }
  .nav-btns button.admin:hover { background: var(--brand2); }

  /* ===== Hero 核心交互区 ===== */
  .hero {
    width: 100%; max-width: 860px;
    padding: 26px 20px 8px;
    display: flex; flex-direction: column; align-items: center; gap: 18px;
  }
  .welcome-card {
    width: 100%;
    background: linear-gradient(135deg, #8B0000 0%, #B22222 55%, #c0392b 100%);
    border-radius: 20px;
    padding: 26px 28px;
    color: #fff;
    box-shadow: 0 12px 34px rgba(139,0,0,0.25);
    position: relative; overflow: hidden;
  }
  .welcome-card::after {
    content: "首义"; position: absolute; right: -14px; bottom: -26px;
    font-family: var(--serif); font-size: 110px; font-weight: 900;
    color: rgba(255,255,255,0.07); pointer-events: none; letter-spacing: 4px;
  }
  .welcome-inner { display: flex; align-items: center; gap: 18px; position: relative; z-index: 1; }
  .w-avatar {
    width: 62px; height: 62px; border-radius: 50%;
    background: rgba(255,255,255,0.95); color: var(--brand);
    font-size: 34px; display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 14px rgba(0,0,0,0.2); flex: 0 0 auto;
  }
  .w-text h1 { font-family: var(--serif); font-size: 22px; font-weight: 800; margin-bottom: 6px; letter-spacing: 1px; }
  .w-text p { font-size: 14px; line-height: 1.7; opacity: 0.95; }

  .search-box {
    width: 100%;
    display: flex; align-items: center; gap: 10px;
    background: var(--card);
    border: 2px solid #f0e2d6;
    border-radius: 999px;
    padding: 6px 8px 6px 20px;
    box-shadow: var(--shadow);
    transition: border-color .2s ease, box-shadow .2s ease;
  }
  .search-box:focus-within { border-color: var(--brand); box-shadow: 0 6px 28px rgba(139,0,0,0.14); }
  .search-box .s-icon { color: var(--brand); font-size: 17px; opacity: 0.75; flex: 0 0 auto; }
  .search-box input {
    flex: 1; border: none; outline: none;
    font-size: 15px; font-family: var(--sans);
    background: transparent; color: var(--text); padding: 10px 0;
  }
  .search-box input::placeholder { color: #c3b8ae; }
  .search-box .send-btn {
    border: none; background: linear-gradient(135deg, var(--brand), var(--brand2));
    color: #fff; font-size: 14px; font-weight: 700;
    padding: 12px 26px; border-radius: 999px; cursor: pointer;
    transition: transform .15s ease, box-shadow .2s ease;
  }
  .search-box .send-btn:hover { transform: scale(1.03); box-shadow: 0 4px 14px rgba(139,0,0,0.35); }
  .search-box .send-btn:active { transform: scale(0.97); }

  .hot-tags { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; align-items: center; }
  .hot-tags .tag-label { font-size: 12.5px; color: var(--muted); margin-right: 2px; }
  .hot-tags button {
    border: 1.5px solid var(--brand); background: #fff; color: var(--brand);
    font-size: 12.5px; font-weight: 600; padding: 6px 13px; border-radius: 999px;
    cursor: pointer; transition: all .18s ease;
  }
  .hot-tags button:hover { background: var(--brand); color: #fff; transform: translateY(-1px); }
  .status { font-size: 12.5px; color: var(--muted); text-align: center; min-height: 18px; }

  /* ===== 问答展示区（卡片列表）===== */
  .content { width: 100%; max-width: 860px; padding: 10px 20px 30px; flex: 1; }
  .section-title {
    font-family: var(--serif); font-size: 16px; font-weight: 800; color: var(--brand);
    display: flex; align-items: center; gap: 8px; margin: 14px 0 12px;
  }
  .section-title::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, #e8d5c4, transparent); }
  .qa-list { display: flex; flex-direction: column; gap: 12px; }

  .qa-card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: 0 3px 14px rgba(139,0,0,0.05);
    padding: 14px 16px;
    display: flex; gap: 13px;
    transition: box-shadow .2s ease, transform .2s ease;
  }
  .qa-card:hover { box-shadow: 0 6px 22px rgba(139,0,0,0.1); }
  .qa-card.match { border-color: var(--brand); box-shadow: 0 0 0 2px rgba(139,0,0,0.12), 0 6px 22px rgba(139,0,0,0.12); }
  .qa-avatar {
    width: 42px; height: 42px; border-radius: 50%; flex: 0 0 auto;
    background: linear-gradient(135deg, var(--brand), var(--brand2));
    color: #fff; font-size: 21px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 3px 10px rgba(139,0,0,0.22);
  }
  .qa-main { flex: 1; min-width: 0; }
  .qa-q {
    font-weight: 700; font-size: 15px; color: #3a2f2a;
    cursor: pointer; display: flex; align-items: center; gap: 8px;
    line-height: 1.55;
  }
  .qa-q .chev { margin-left: auto; color: var(--muted); font-size: 12px; transition: transform .25s ease; flex: 0 0 auto; }
  .qa-card.open .qa-q .chev { transform: rotate(180deg); color: var(--brand); }
  .qa-a {
    max-height: 0; overflow: hidden;
    transition: max-height .35s ease, margin .3s ease, opacity .3s ease;
    opacity: 0; margin-top: 0;
    font-size: 14px; line-height: 1.75; color: #555;
    white-space: pre-wrap; word-break: break-word;
  }
  .qa-card.open .qa-a { max-height: 600px; opacity: 1; margin-top: 8px; }

  /* 学长回答卡（提问后置顶展示） */
  .reply-card {
    background: linear-gradient(135deg, #fff8f3, #fff);
    border: 1.5px solid #f3ddd0;
    border-radius: var(--radius);
    box-shadow: 0 6px 22px rgba(139,0,0,0.1);
    padding: 16px;
    display: flex; gap: 13px;
  }
  .reply-card .qa-a { max-height: none; opacity: 1; margin-top: 2px; color: #3d342f; }
  .reply-card .reply-tag {
    display: inline-block; font-size: 11px; font-weight: 700; color: var(--brand);
    background: #ffe9e0; padding: 2px 10px; border-radius: 999px; margin-bottom: 6px;
  }

  /* ===== 底部 ===== */
  .foot {
    width: 100%; padding: 20px;
    display: flex; flex-wrap: wrap; gap: 10px;
    align-items: center; justify-content: space-between;
    border-top: 1px solid var(--line);
    font-size: 12.5px; color: var(--muted);
  }
  .foot .foot-btn {
    border: 1.5px solid rgba(139,0,0,0.3); background: #fff; color: var(--brand);
    font-size: 12.5px; padding: 7px 16px; border-radius: 999px; cursor: pointer;
    transition: all .2s ease; font-weight: 600;
  }
  .foot .foot-btn:hover { background: var(--brand); color: #fff; }

  /* ===== 遮罩层（登录 / 管理后台 / 二维码）===== */
  .overlay {
    position: fixed; inset: 0; z-index: 50;
    background: rgba(30,15,8,0.5); backdrop-filter: blur(4px);
    display: none; align-items: center; justify-content: center; padding: 18px;
  }
  .overlay.show { display: flex; }
  .panel {
    width: 100%; max-width: 440px; max-height: 92%;
    background: #fff; border-radius: 18px; padding: 22px;
    display: flex; flex-direction: column;
    box-shadow: 0 24px 60px rgba(0,0,0,0.25);
    overflow-y: auto;
  }
  .panel h3 { font-family: var(--serif); font-size: 18px; color: var(--brand); margin-bottom: 4px; }
  .panel .sub { font-size: 12.5px; color: var(--muted); margin-bottom: 16px; line-height: 1.6; }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 13px; margin-bottom: 5px; color: #555; font-weight: 600; }
  .field input, .field textarea {
    width: 100%; border: 1.5px solid #f0e0d2; border-radius: 10px;
    padding: 10px 12px; font-size: 14px; outline: none; font-family: inherit;
    background: #fffdfb;
  }
  .field input:focus, .field textarea:focus { border-color: var(--brand); }
  .field textarea { resize: vertical; min-height: 60px; }
  .btn-row { display: flex; gap: 8px; margin-top: 6px; }
  .btn { flex: 1; border: none; border-radius: 10px; padding: 11px; font-size: 14px; font-weight: 600; cursor: pointer; transition: transform .12s ease; }
  .btn:active { transform: scale(0.97); }
  .btn.primary { background: linear-gradient(135deg, var(--brand), var(--brand2)); color: #fff; }
  .btn.ghost { background: #f3f0ec; color: #555; }
  .btn.danger { background: #fff0f0; color: #d33; }
  .btn.cloud { background: #1f883d; color: #fff; }
  .err { color: #d33; font-size: 12.5px; min-height: 16px; margin-top: 4px; }

  /* ===== 管理后台：科技蓝 / 深灰 ===== */
  .admin-panel { background: #141b2b; color: #dbe4f0; border: 1px solid #22304a; }
  .admin-panel h3 { color: #4da3ff; }
  .admin-panel .sub { color: #7d8db0; }
  .admin-panel .field label { color: #9fb0cf; }
  .admin-panel .field input, .admin-panel .field textarea {
    background: #0e1420; color: #dbe4f0; border-color: #2a3a58;
  }
  .admin-panel .field input:focus, .admin-panel .field textarea:focus { border-color: #4da3ff; }
  .admin-panel .btn.primary { background: linear-gradient(135deg, #2563eb, #3b82f6); color: #fff; }
  .admin-panel .btn.ghost { background: #22304a; color: #9fb0cf; }
  .admin-panel .btn.danger { background: rgba(220,38,38,0.18); color: #f87171; }
  .admin-panel .btn.cloud { background: #16a34a; color: #fff; }
  .admin-panel .qa-item { border-color: #2a3a58; background: #0e1420; }
  .admin-panel .qa-item .del { background: rgba(220,38,38,0.2); color: #f87171; }
  .admin-panel .qa-item .qidx { color: #7d8db0; }
  .admin-panel .count { color: #7d8db0; }
  .admin-tools { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .admin-tools .btn { flex: none; padding: 8px 12px; font-size: 12.5px; }
  .qa-edit { overflow-y: auto; flex: 1; border-top: 1px dashed #2a3a58; padding-top: 10px; max-height: 46vh; }
  .qa-item { border: 1px solid #f0e0d2; border-radius: 12px; padding: 10px; margin-bottom: 10px; background: #fffaf6; }
  .qa-item .del { float: right; border: none; background: #ffe3e3; color: #d33; border-radius: 8px; padding: 3px 9px; font-size: 12px; cursor: pointer; }
  .qa-item .qidx { font-size: 11px; color: var(--muted); }
  .count { font-size: 12px; color: var(--muted); margin-bottom: 8px; }

  /* 二维码弹窗 */
  .qr-card { text-align: center; max-width: 340px; }
  .qr-card img { width: 100%; max-width: 250px; border-radius: 12px; border: 1px solid var(--line); margin: 6px 0 10px; }
  .qr-card .tip { font-size: 13px; color: var(--muted); margin-top: 4px; }

  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-thumb { background: #e5c9b8; border-radius: 3px; }

  /* 加载动画 */
  .loading-dots { display: inline-flex; gap: 5px; }
  .loading-dots span { width: 7px; height: 7px; background: var(--brand); border-radius: 50%; opacity: .35; animation: blink 1.2s infinite; }
  .loading-dots span:nth-child(2){ animation-delay: .2s; }
  .loading-dots span:nth-child(3){ animation-delay: .4s; }
  @keyframes blink { 0%,60%,100%{ opacity:.3; transform: translateY(0);} 30%{ opacity:1; transform: translateY(-3px);} }

  @media (max-width: 560px) {
    .nav { padding: 14px 16px 6px; }
    .logo .name { font-size: 18px; }
    .welcome-card { padding: 20px 18px; }
    .w-avatar { width: 52px; height: 52px; font-size: 28px; }
    .w-text h1 { font-size: 19px; }
    .search-box .send-btn { padding: 11px 18px; }
    .hero, .content { padding-left: 14px; padding-right: 14px; }
  }
</style>
</head>
<body>

<!-- ===== 顶部导航 ===== -->
<header class="nav">
  <div class="logo">
    <div class="emblem">🎓</div>
    <div class="name">首义学长<small>· 校园问答</small></div>
  </div>
  <div class="nav-btns">
    <button onclick="scrollToQA()">📚 全部话题</button>
    <button onclick="showQR()">💬 学长微信</button>
    <button id="loginBtn" onclick="openLogin()">🔑 登录</button>
    <button class="admin" id="adminBtn" style="display:none" onclick="openAdmin()">🛠 管理问答</button>
    <button id="logoutBtn" style="display:none" onclick="logout()">退出登录</button>
  </div>
</header>

<!-- ===== Hero 核心交互区 ===== -->
<section class="hero">
  <div class="welcome-card">
    <div class="welcome-inner">
      <div class="w-avatar">🎓</div>
      <div class="w-text">
        <h1>学弟学妹你好呀～</h1>
        <p>我是首义的学长，关于学校吃住行、选课、宿舍、证件这些事儿都可以问我。直接输入问题，或者在下面点标签试试～</p>
      </div>
    </div>
  </div>

  <div class="search-box">
    <span class="s-icon">🔍</span>
    <input id="inp" placeholder="宿舍床多大？四级啥时候能考？…" autocomplete="off" />
    <button class="send-btn" onclick="send()">提问</button>
  </div>

  <div class="hot-tags" id="hotTags"></div>
  <div class="status" id="statusLine">正在加载问答库…</div>
</section>

<!-- ===== 问答展示区 ===== -->
<main class="content">
  <div class="section-title" id="qaTitle">📖 学长知道这些 · 点开看答案</div>
  <div class="qa-list" id="qaList"></div>
</main>

<!-- ===== 底部 ===== -->
<footer class="foot">
  <span>© 2026 首义学长 · 武昌首义学院校园问答助手</span>
  <button class="foot-btn" onclick="showQR()">💬 添加学长微信</button>
</footer>

<!-- 登录遮罩 -->
<div class="overlay" id="loginOverlay">
  <div class="panel">
    <h3>🔐 管理员登录</h3>
    <div class="sub">登录后即可随时增删改问答内容；改完点「☁ 保存到云端」同步给所有人</div>
    <div class="field"><label>账号</label><input id="acc" placeholder="请输入账号" autocomplete="off" /></div>
    <div class="field"><label>密码</label><input id="pwd" type="password" placeholder="请输入密码" autocomplete="off" onkeydown="if(event.key==='Enter')doLogin()" /></div>
    <div class="err" id="loginErr"></div>
    <div class="btn-row">
      <button class="btn ghost" onclick="closeLogin()">取消</button>
      <button class="btn primary" onclick="doLogin()">登录</button>
    </div>
  </div>
</div>

<!-- 管理后台遮罩（科技蓝 / 深灰） -->
<div class="overlay" id="adminOverlay">
  <div class="panel admin-panel">
    <h3>🛠 问答管理后台</h3>
    <div class="sub">登录后随时增删改；改完点「☁ 保存到云端」，GitHub Pages 自动重新部署，所有人刷新即见。</div>
    <div class="admin-tools">
      <button class="btn primary" onclick="addItem()">＋ 新增</button>
      <button class="btn primary" onclick="saveLocalQA()">💾 存本机</button>
      <button class="btn cloud" onclick="saveToCloud()">☁ 保存到云端</button>
      <button class="btn ghost" onclick="setToken()">🔑 设置Token</button>
      <button class="btn ghost" onclick="exportQA()">⬇ 导出</button>
      <button class="btn danger" onclick="resetQA()">↺ 恢复默认</button>
    </div>
    <div class="count" id="qaCount"></div>
    <div class="qa-edit" id="qaEdit"></div>
    <div class="btn-row" style="margin-top:12px">
      <button class="btn ghost" onclick="closeAdmin()">关闭</button>
    </div>
  </div>
</div>

<!-- 学长微信二维码弹窗 -->
<div class="overlay" id="qrOverlay" onclick="if(event.target===this)closeQR()">
  <div class="panel qr-card">

  const re = /Q:\s*([\s\S]*?)\nA:\s*([\s\S]*?)\n\n/g;
  const out = []; let m;
  while((m = re.exec(text))){ const q=m[1].trim(), a=m[2].trim(); if(q&&a) out.push({q,a}); }
  return out;
}
function getLocal(){ try { const r = localStorage.getItem(LS_QA); if(r){ const a=JSON.parse(r); if(Array.isArray(a)&&a.length) return a; } } catch(e){} return null; }
function saveLocal(qa){ try { localStorage.setItem(LS_QA, JSON.stringify(qa.map(({q,a})=>({q:q.trim(),a:a.trim()})))); } catch(e){} }

// 加载问答库：先本地缓存（快），再拉云端（最新）
async function loadQA(){
  const cached = getLocal();
  if(cached){ QA = cached; refreshTokens(QA); QA_LOADED = true; }
  try {
    const r = await fetch(GH.path + "?t=" + Date.now(), { cache: "no-store" });
    if(r.ok){
      const arr = parseQA(await r.text());
      if(arr.length && !LOCAL_DIRTY){
        QA = arr; refreshTokens(QA); QA_LOADED = true; saveLocal(QA);
      }
    }
  } catch(e){ /* 离线时用缓存 */ }
  if(QA_LOADED){
    document.getElementById("statusLine").textContent = "问答库已加载 · 直接输入问题，或点下方标签试试";
    renderQA();
  } else {
    document.getElementById("statusLine").textContent = "问答库加载失败，请检查网络或刷新页面";
  }
}

function similarity(a, b){
  const ba = tokens(a), bb = tokens(b);
  if(ba.size===0 || bb.size===0){
    const ca = new Set(normalize(a)), cb = new Set(normalize(b));
    if(ca.size===0 || cb.size===0) return 0;
    let inter=0; ca.forEach(x=>{ if(cb.has(x)) inter++; });
    return inter / Math.min(ca.size, cb.size);
  }
  let common=0; ba.forEach(x=>{ if(bb.has(x)) common++; });
  if(common===0) return 0;
  let uw=0; ba.forEach(x=> uw += idf(x));
  if(uw===0) return 0;
  let shared=0; ba.forEach(x=>{ if(bb.has(x)) shared += idf(x); });
  return shared / uw;
}
function bestMatch(userQ){
  const u = normalize(userQ);
  for(const key in ALIASES){
    if(key && u.indexOf(key) !== -1){
      for(const it of QA){ if(it.q === ALIASES[key]) return [0.99, it]; }
    }
  }
  let best=0, item=null;
  for(const it of QA){
    let s = similarity(userQ, it.q);
    if(u && (u.indexOf(normalize(it.q)) !== -1 || normalize(it.q).indexOf(u) !== -1)) s = Math.max(s, 0.95);
    if(s > best){ best = s; item = it; }
  }
  return [best, item];
}
function stripFillers(s){
  let out = s;
  for(const w of FILLERS) out = out.split(w).join("");
  return out.trim();
}
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

function escAttr(s){ return String(s).replace(/'/g, "&#39;").replace(/"/g, "&quot;"); }
function escHtml(s){ return String(s).replace(/</g, "&lt;").replace(/>/g, "&gt;"); }

// ===== 渲染全部问答卡片 =====
const qaList = document.getElementById("qaList");
function renderQA(){
  qaList.innerHTML = "";
  if(!QA.length){
    qaList.innerHTML = "<div style='text-align:center;color:#c3b8ae;padding:30px;'>问答库为空</div>";
    return;
  }
  QA.forEach((it)=>{
    const card = document.createElement("div");
    card.className = "qa-card";
    card.dataset.q = it.q;
    card.innerHTML =
      '<div class="qa-avatar">🎓</div>' +
      '<div class="qa-main">' +
        '<div class="qa-q" onclick="toggleCard(this)">' + escHtml(it.q) + '<span class="chev">▾</span></div>' +
        '<div class="qa-a">' + escHtml(it.a) + '</div>' +
      '</div>';
    qaList.appendChild(card);
  });
}
function toggleCard(qEl){
  qEl.closest(".qa-card").classList.toggle("open");
}

// 提问后：在列表顶部插入学长回答卡
function addReply(text, highlightQ){
  const card = document.createElement("div");
  card.className = "reply-card";
  card.innerHTML =
    '<div class="qa-avatar">🎓</div>' +
    '<div class="qa-main">' +
      '<span class="reply-tag">首义学长</span>' +
      '<div class="qa-a">' + escHtml(text) + '</div>' +
    '</div>';
  qaList.prepend(card);
  if(highlightQ){
    const target = document.querySelector('.qa-card[data-q="' + CSS.escape(highlightQ) + '"]');
    if(target){ target.classList.add("match"); target.classList.add("open"); }
  }
  card.scrollIntoView({ behavior: "smooth", block: "start" });
}

function send(){
  const v = inp.value.trim();
  if(!v) return;
  inp.value = "";
  if(QUIT_WORDS.has(v)){ addReply(pick(["好嘞，那学长先撤啦，祝你大学生活顺顺利利的～","行～有啥事随时回来找我，拜拜👋"])); return; }
  if(HELP_WORDS.has(v)){ scrollToQA(); return; }
  if(!QA_LOADED || QA.length===0){ addReply("学长正在加载问答库，稍微等一下下哈～也可以刷新页面试试。"); return; }
  const core = stripFillers(v);
  const [score, item] = bestMatch(v);
  if(!core){ addReply(pick(FALLBACKS)); return; }
  if(item && score >= THRESHOLD){
    addReply(pick(OPENERS) + "\n\n" + item.a.trim() + "\n\n" + pick(CLOSERS), item.q);
  } else {
    addReply(pick(FALLBACKS));
  }
}

const inp = document.getElementById("inp");
inp.addEventListener("keydown", e=>{ if(e.key==="Enter") send(); });

// ===== 热门标签 =====

];

HOT_TAGS.forEach(t=>{

function scrollToQA(){
  document.getElementById("qaTitle").scrollIntoView({ behavior: "smooth", block: "start" });

// ===== 登录（游客可自由提问；登录后才可改数据库并同步云端）=====
function openLogin(){
  document.getElementById("loginOverlay").classList.add("show");
  document.getElementById("loginErr").textContent = "";
  document.getElementById("acc").value = "";
  document.getElementById("pwd").value = "";
}
function closeLogin(){ document.getElementById("loginOverlay").classList.remove("show"); }
function doLogin(){
  const acc = document.getElementById("acc").value.trim();
  const pwd = document.getElementById("pwd").value;
  if(acc === LOGIN.account && pwd === LOGIN.password){
    localStorage.setItem(LS_ADMIN, "1");
    enterAdmin();
    closeLogin();
  } else {
    document.getElementById("loginErr").textContent = "账号或密码不对，再试试～";
  }
}
function enterAdmin(){
  LOCAL_DIRTY = true;  // 管理员态：以本机编辑为准，云端不覆盖
  document.getElementById("loginBtn").style.display = "none";
  document.getElementById("adminBtn").style.display = "";
  document.getElementById("logoutBtn").style.display = "";
  document.getElementById("statusLine").textContent = "管理员已登录 · 点「🛠 管理问答」编辑，改完点「☁ 保存到云端」同步给所有人";
  ensureToken(false);  // 首次登录提示粘贴同步 Token（仅一次，存本机）
}
function logout(){
  localStorage.removeItem(LS_ADMIN);
  closeAdmin();
  LOCAL_DIRTY = false;
  document.getElementById("loginBtn").style.display = "";
  document.getElementById("adminBtn").style.display = "none";
  document.getElementById("logoutBtn").style.display = "none";
  document.getElementById("statusLine").textContent = "在线 · 游客可自由提问；登录后可管理问答库";
}
// 启动：已登录则直接显示管理入口（游客默认即可自由提问）
if(localStorage.getItem(LS_ADMIN) === "1") enterAdmin();

// ===== 学长微信二维码 =====
function showQR(){ document.getElementById("qrOverlay").classList.add("show"); }
function closeQR(){ document.getElementById("qrOverlay").classList.remove("show"); }

// ===== 管理后台 =====
function openAdmin(){
  renderEdit();
  document.getElementById("adminOverlay").classList.add("show");
}
function closeAdmin(){ document.getElementById("adminOverlay").classList.remove("show"); }
function renderEdit(){
  document.getElementById("qaCount").textContent = "共 " + QA.length + " 条";
  const box = document.getElementById("qaEdit");
  box.innerHTML = "";
  QA.forEach((it, i)=>{
    const div = document.createElement("div");
    div.className = "qa-item";
    div.innerHTML = "<span class='qidx'>#" + (i+1) + "</span><button class='del' onclick='delItem(" + i + ")'>删除</button>" +
      "<div class='field'><label>问题</label><input oninput='QA[" + i + "].q=this.value; LOCAL_DIRTY=true;' value='" + escAttr(it.q) + "' /></div>" +
      "<div class='field'><label>答案</label><textarea oninput='QA[" + i + "].a=this.value; LOCAL_DIRTY=true;'>" + escHtml(it.a) + "</textarea></div>";
    box.appendChild(div);
  });
}
function addItem(){
  QA.push({ q: "新问题？", a: "新答案", toks: new Set() });
  LOCAL_DIRTY = true;
  refreshTokens(QA);
  renderEdit();
  document.getElementById("qaEdit").scrollTop = document.getElementById("qaEdit").scrollHeight;
}
function delItem(i){ QA.splice(i, 1); LOCAL_DIRTY = true; refreshTokens(QA); renderEdit(); }
function saveLocalQA(){
  QA = QA.filter(it => it.q && it.a).map(it => ({ q: it.q.trim(), a: it.a.trim() }));
  refreshTokens(QA);
  saveLocal(QA);
  LOCAL_DIRTY = true;
  renderQA();
  document.getElementById("qaCount").textContent = "已存本机 · 共 " + QA.length + " 条";
}
function resetQA(){
  if(!confirm("确定恢复为默认问答（本机修改会清空，且会重新从云端拉取）？")) return;
  localStorage.removeItem(LS_QA);
  LOCAL_DIRTY = false;
  location.reload();
}
function setToken(){ const t = ensureToken(true); if(t) alert("✅ 同步 Token 已保存（仅保存在你本机浏览器）。"); else alert("未输入 Token。"); }
function exportQA(){
  const lines = QA.filter(it=>it.q&&it.a).map(it => "Q: " + it.q.trim() + "\nA: " + it.a.trim() + "\n").join("\n");
  const blob = new Blob([lines], { type: "text/plain;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "qa_data.txt";
  a.click();
  URL.revokeObjectURL(a.href);
  alert("已导出 qa_data.txt 作为本地备份 💾\n（如要同步给所有人，点「☁ 保存到云端」即可，无需手动导出）");
}
async function saveToCloud(){
  const tok = ensureToken(false);
  if(!tok){ alert("还没设置同步 Token，无法保存到云端。登录后按提示粘贴，或点「🔑 设置Token」。"); return; }
  try {
    const head = { Authorization: "Bearer " + tok };
    // 1. 取当前文件 sha
    const getR = await fetch("https://api.github.com/repos/" + GH.owner + "/" + GH.repo + "/contents/" + GH.path + "?ref=" + GH.branch, { headers: head });
    if(!getR.ok) throw new Error("读取仓库文件失败 " + getR.status);
    const sha = (await getR.json()).sha;
    // 2. 组装内容
    QA = QA.filter(it => it.q && it.a).map(it => ({ q: it.q.trim(), a: it.a.trim() }));
    refreshTokens(QA);
    const content = QA.map(it => "Q: " + it.q + "\nA: " + it.a + "\n\n").join("");
    const b64 = btoa(unescape(encodeURIComponent(content)));
    // 3. 写回
    const putR = await fetch("https://api.github.com/repos/" + GH.owner + "/" + GH.repo + "/contents/" + GH.path, {
      method: "PUT",
      headers: Object.assign({ "Content-Type": "application/json" }, head),
      body: JSON.stringify({ message: "update qa via web admin", content: b64, sha: sha, branch: GH.branch })
    });
    if(!putR.ok) throw new Error("写入仓库失败 " + putR.status);
    saveLocal(QA);
    LOCAL_DIRTY = true;
    renderQA();
    document.getElementById("qaCount").textContent = "已同步云端 · 共 " + QA.length + " 条";
    alert("✅ 已保存到云端！GitHub Pages 会在几分钟内重新部署，其他人刷新页面即可看到新内容。");
  } catch(e){ alert("云端保存失败：" + e.message); }
}

// 启动：渲染问答列表
loadQA();
